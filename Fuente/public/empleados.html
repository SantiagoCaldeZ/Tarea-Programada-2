<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Empleados</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <h1>Empleados</h1>

  <!-- Barra de búsqueda -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar...">
    <select id="filterType">
      <option value="Nombre">Nombre</option>
      <option value="Documento">Documento</option>
    </select>
    <button id="searchBtn"><i class="fa fa-search"></i></button>
  </div>

  <!-- Tabla de empleados -->
  <div class="table-container">
    <table id="empleadosTable">
      <thead>
        <tr>
          <th>Nombre del Empleado</th>
          <th>Documento de Identidad</th>
        </tr>
      </thead>
      <tbody>
        <!-- Aquí se cargan los empleados -->
      </tbody>
    </table>
  </div>
  
  <!-- Modal de acciones -->
  <div id="modalAcciones" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2 id="empleadoSeleccionado"></h2>
      <p>¿Qué acción desea realizar?</p>
      <div class="button-group-acciones">
        <button onclick="consultarEmpleado()">Consultar</button>
        <button onclick="borrarEmpleado()">Borrar</button>
        <button onclick="modificarEmpleado()">Modificar</button>
        <button onclick="listarMovimientos()">Listar Movimientos</button>
        <button onclick="insertarMovimiento()">Insertar Movimiento</button>
      </div>
    </div>
  </div>

  <!-- Botón Insertar -->
  <div class="button-group">
    <button id="btn-insertar">INSERTAR</button>
  </div>

  <script>
    document.getElementById("btn-insertar").addEventListener("click", () => {
      window.location.href = "insertar.html"; 
    });

    let empleadoActual = null;

    // Función para cargar empleados
    async function cargarEmpleados() {
        try {
            const response = await fetch("/empleados");
            const data = await response.json();

            if (data.success) {
              mostrarEmpleados(data.data);
            } else {
              Swal.fire("Error", data.message || "No se pudieron cargar los empleados", "error");
            }
        } catch (err) {
            console.error("Error en cargarEmpleados:", err);
            Swal.fire("Error", "No se pudieron cargar los empleados", "error");
        }
    }

    // Mostrar empleados en tabla con evento click
    function mostrarEmpleados(empleados) {
      const tbody = document.querySelector("#empleadosTable tbody");
      tbody.innerHTML = "";
      empleados.forEach(emp => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${emp.Nombre}</td>
          <td>${emp.ValorDocumentoIdentidad}</td>
        `;
        fila.addEventListener("click", () => {
          empleadoActual = emp;                        
          document.getElementById("empleadoSeleccionado").textContent = emp.Nombre;
          document.getElementById("modalAcciones").style.display = "block";
        });
        tbody.appendChild(fila);
      });
    }

    // Buscar empleados con filtro
    document.getElementById("searchBtn").addEventListener("click", async () => {
        const valor = document.getElementById("searchInput").value.trim();
        const tipo = document.getElementById("filterType").value;

        try {
            const response = await fetch("/empleados-filtrar", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ valor, tipo })
            });
            const data = await response.json();
            if (data.success) {
              mostrarEmpleados(data.data);
            } else {
              Swal.fire("Error", data.message || "No se pudo aplicar el filtro", "error");
            }
        } catch (err) {
            console.error(err);
            Swal.fire("Error", "No se pudo aplicar el filtro", "error");
        }
    });

    // Buscar con Enter
    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        document.getElementById("searchBtn").click();
      }
    });

    // Cerrar modal
    document.getElementById("closeModal").onclick = function() {
      document.getElementById("modalAcciones").style.display = "none";
    };
    window.onclick = function(event) {
      const modal = document.getElementById("modalAcciones");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };

    // Funciones de acciones
    async function consultarEmpleado() {
      if (!empleadoActual || !empleadoActual.Id) {
        Swal.fire("Error", "Vuelve a seleccionar el empleado de la lista.", "error");
        return;
      }
      try {
        const response = await fetch(`/empleados-consultar/${encodeURIComponent(empleadoActual.Id)}`);
        const data = await response.json();
        if (data.success) {
          const emp = data.data;
          Swal.fire({
            title: "Consulta de Empleado",
            html: `
              <b>Nombre:</b> ${emp.Nombre}<br>
              <b>Documento:</b> ${emp.ValorDocumentoIdentidad}<br>
              <b>Puesto:</b> ${emp.Puesto}<br>
              <b>Saldo Vacaciones:</b> ${emp.SaldoVacaciones}
            `,
            icon: "info"
          });
        } else {
          Swal.fire("Error", data.message || "No se pudo consultar el empleado", "error");
        }
      } catch (err) {
        console.error(err);
        Swal.fire("Error", "No se pudo conectar con el servidor", "error");
      }
    }

    function borrarEmpleado() {
      Swal.fire({
        title: "¿Está seguro?",
        html: `
          <b>Nombre:</b> ${empleadoActual.Nombre}<br>
          <b>Documento:</b> ${empleadoActual.ValorDocumentoIdentidad}<br>
          <br>¿Desea eliminar este empleado?`,
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar"
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            const response = await fetch(`/empleados-borrar/${empleadoActual.Id}`, {
              method: "DELETE"
            });
            const data = await response.json();

            if (data.success) {
              Swal.fire("Eliminado", "El empleado ha sido dado de baja", "success");
              cargarEmpleados(); // recarga la lista
            } else {
              Swal.fire("Error", data.message || "No se pudo borrar el empleado", "error");
            }
          } catch (err) {
            console.error(err);
            Swal.fire("Error", "No se pudo conectar con el servidor", "error");
          }
        }
      });
    }
    function modificarEmpleado() {
      // Guardamos los datos del empleado seleccionado en localStorage
      localStorage.setItem("empleadoModificar", JSON.stringify(empleadoActual));

      // Redirigimos a la página de modificación
      window.location.href = "modificar.html";
    }
    
    function listarMovimientos() {
      Swal.fire("Movimientos", `Mostrando movimientos de ${empleadoActual.Nombre}`, "info");
    }
    function insertarMovimiento() {
      Swal.fire("Insertar Movimiento", `Insertando movimiento para ${empleadoActual.Nombre}`, "info");
    }

    // Al cargar la página
    window.onload = cargarEmpleados;
  </script>
</body>
</html>
